# Push a tag like v1.0.0 to build ScreenToggle.app and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        run: ditto -c -k --keepParent ScreenToggle.app "ScreenToggle-$GITHUB_REF_NAME.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ScreenToggle-$GITHUB_REF_NAME.zip" --generate-notes --title "ScreenToggle $GITHUB_REF_NAME"
